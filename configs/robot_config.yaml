# Robot Configuration - OpenDuck Mini V3
# Central configuration file for robot subsystems
# Created: 18 January 2026

# =================================================================
# HEAD CONTROLLER - 4-DOF CONFIGURATION (CORRECTED 19 Jan 2026)
# DO NOT CHANGE TO 2-DOF - Required for V2 simulation compatibility
# See: V3_HEAD_DOF_ANALYSIS.md for rationale
# =================================================================
head:
  enabled: true

  # 4-DOF Head Configuration (V2-compatible)
  # Matches Open_Duck_Mini V2 simulation for direct policy deployment
  neck_pitch_channel: 0     # PCA9685 ch 0 - MG90S #1 - Base neck up/down
  head_pitch_channel: 1     # PCA9685 ch 1 - MG90S #2 - Head nod forward/back
  head_yaw_channel: 2       # PCA9685 ch 2 - MG90S #3 - Head rotate left/right
  head_roll_channel: 3      # PCA9685 ch 3 - MG90S #4 - Head tilt side-to-side (Pixar secret!)

  limits:
    # Neck pitch (base movement) - From V2 XML line 223
    neck_pitch_min: -20      # -20° = neck down
    neck_pitch_max: 65       # +65° = neck up (full range)

    # Head pitch (nod) - From V2 XML line 240
    head_pitch_min: -45      # -45° = nod down
    head_pitch_max: 45       # +45° = look up

    # Head yaw (pan/rotate) - CORRECTED: MG90S servo limit is ±90°
    # Original V2 XML allowed ±160° but hardware cannot achieve this
    # See: FIRMWARE_CAD_BINDING_REPORT.md, Mismatch B7
    head_yaw_min: -90        # -90° = hard left (MG90S physical limit)
    head_yaw_max: 90         # +90° = hard right (MG90S physical limit)

    # Head roll (tilt) - From V2 XML line 266
    head_roll_min: -30       # -30° = tilt left
    head_roll_max: 30        # +30° = tilt right

  servo_config:
    neck_pitch_inverted: false
    head_pitch_inverted: false
    head_yaw_inverted: false
    head_roll_inverted: false

  animation:
    default_speed_ms: 300       # Default movement duration (ms)
    easing: 'ease_in_out'       # Default easing function
    nod_amplitude: 15           # Default nod amplitude (degrees)
    shake_amplitude: 20         # Default shake amplitude (degrees)
    tilt_amplitude: 10          # Head roll tilt for curious/confused (NEW!)
    glance_max_deviation: 30    # Max random glance offset (degrees)
    glance_hold_ms: 500         # Duration to hold glance position

  safety:
    velocity_limit_deg_per_sec: 180    # Max angular velocity
    soft_limit_margin: 10              # Degrees inside hard limits for soft warning

# =================================================================
# ARM SYSTEM - Joint limits and collision avoidance
# Added Day 47 Phase 4 — CAD Error 1 (arm-head collision) mitigation
# =================================================================
arms:
  enabled: true
  left_arm:
    shoulder_yaw_id: TBD    # STS3215 servo ID — assign during assembly
    shoulder_pitch_id: TBD
    elbow_id: TBD
  right_arm:
    shoulder_yaw_id: TBD
    shoulder_pitch_id: TBD
    elbow_id: TBD

  limits:
    # Static joint limits (degrees)
    shoulder_yaw_min: -120
    shoulder_yaw_max: 120
    shoulder_pitch_min: -10    # Slight backward reach
    shoulder_pitch_max: 90     # Full forward/up reach
    elbow_min: 0               # No hyperextension
    elbow_max: 135

  collision_zone:
    # When shoulder_yaw in forward zone, cap pitch to avoid head strike
    # CAD analysis: arm at 45° pitch + yaw in [-30,+30] → head collision
    forward_yaw_min: -30
    forward_yaw_max: 30
    forward_pitch_max: 30      # Reduced from 90° when in forward zone

  safety:
    velocity_limit_deg_per_sec: 120    # Max angular velocity (slower than head)
    soft_limit_margin: 5               # Degrees inside hard limits for soft warning

# =================================================================
# LED SYSTEM
# NeoPixel LED configuration for eye displays and status
# =================================================================
leds:
  enabled: true
  left_eye:
    pin: 10            # GPIO pin for left eye LED strip (MIGRATED from GPIO 18 - I2S conflict)
    count: 16          # Number of LEDs per ring (CORRECTED from 37)
    brightness: 0.8    # Default brightness (0.0 - 1.0)
  right_eye:
    pin: 13            # GPIO pin for right eye LED strip
    count: 16          # Number of LEDs per ring (CORRECTED from 37)
    brightness: 0.8    # Default brightness (0.0 - 1.0)

  animation:
    update_rate_hz: 50          # Animation update rate
    color_transition_ms: 300    # Default color transition duration
    use_hsv_interpolation: true # Use HSV arc for color transitions

# =================================================================
# I2C DEVICES
# =================================================================
i2c:
  bus: 1                        # I2C bus number (RPi default)
  pca9685:
    address: 0x40               # PCA9685 default address
    frequency: 50               # PWM frequency (50Hz for servos)

# =================================================================
# AUDIO SYSTEM
# =================================================================
audio:
  enabled: true
  i2s:
    bck_pin: 18                 # I2S bit clock
    ws_pin: 19                  # I2S word select
    data_out_pin: 21            # I2S data out
  sample_rate: 44100
  channels: 1

# =================================================================
# SAFETY SYSTEM
# =================================================================
safety:
  emergency_stop_pin: 26        # GPIO for emergency stop button
  watchdog_timeout_ms: 1000     # Watchdog timer timeout
  startup_delay_ms: 500         # Delay before enabling servos
